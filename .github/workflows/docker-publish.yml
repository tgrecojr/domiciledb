# @spec PLATFORM-OPS-004, PLATFORM-OPS-008, PLATFORM-OPS-009
name: Build and Publish Docker Image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  supply-chain:
    name: Supply chain
    uses: ./.github/workflows/supply-chain.yml
    secrets: inherit

  build-and-push:
    needs: supply-chain
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Build once into the runner's Docker (single-platform image) so the
      # smoke below runs the exact bytes that would be published. Nothing is
      # pushed yet.
      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: domiciledb:smoke
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # @spec PLATFORM-OPS-008
      # Boot the image as shipped: empty /data, no env beyond the image's own.
      # /api/health never touches the database, so the dashboard request is
      # the one that proves better-sqlite3 loads on this runtime (a builder /
      # runtime Node mismatch or a stale runtime digest fails here, not in prod).
      - name: Smoke-boot the image
        run: |
          docker run -d --name smoke -p 3000:3000 domiciledb:smoke
          deadline=$((SECONDS + 90))
          health=000; root=000
          while [ "$SECONDS" -lt "$deadline" ]; do
            health=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/health || true)
            if [ "$health" = "200" ]; then
              root=$(curl -sL -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/ || true)
              if [ "$root" = "200" ]; then
                echo "smoke ok: /api/health=$health /=$root after ${SECONDS}s"
                exit 0
              fi
            fi
            sleep 3
          done
          echo "::error::smoke failed after 90s: /api/health=$health /=$root"
          exit 1

      # @spec PLATFORM-OPS-009
      - name: Smoke logs and cleanup
        if: always()
        run: |
          docker logs smoke 2>&1 || true
          docker rm -f smoke >/dev/null 2>&1 || true

      # Same context and cache as the smoke build, so this is a cache hit that
      # only exports the layers to GHCR and yields the registry digest the
      # signature and attestations below are bound to.
      - name: Push Docker image
        id: build
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v4.1.2

      - name: Sign image with cosign (keyless)
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Generate SBOM (SPDX)
        if: github.event_name != 'pull_request'
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest SBOM
        if: github.event_name != 'pull_request'
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true

      - name: Attest build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
